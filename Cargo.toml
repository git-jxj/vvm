[package]
name = "vvm"
version = "0.1.2"
edition = "2021"
description = "vLLM Version Manager - manage multiple vLLM installations"
license = "Apache-2.0"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
colored = "2"
ctrlc = "3"
dirs = "6"
indicatif = "0.17"
reqwest = { version = "0.12", features = ["blocking", "rustls-tls", "json"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shellexpand = "3"
thiserror = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
